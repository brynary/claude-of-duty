<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Claude of Duty">
  <!--
    A reticle, not a monogram: two letters turn to mush at 16 px, a ring with
    four ticks stays a ring. Colours are the HUD's own ink and tactical green.
  -->
  <rect width="32" height="32" rx="6" fill="#0b100d"/>
  <!-- The ticks clear the ring by 2.5 units, which is the ~1 px of dark that
       keeps them from merging into one blob at 16 px. -->
  <g fill="none" stroke="#a8d493" stroke-width="3" stroke-linecap="round">
    <circle cx="16" cy="16" r="7"/>
    <path d="M16 1.6v3.6M16 26.8v3.6M1.6 16h3.6M26.8 16h3.6"/>
  </g>
  <circle cx="16" cy="16" r="2" fill="#a8d493"/>
</svg>
